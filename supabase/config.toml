project_id = "sophia-creative-studio"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# ---------------------------------------------------------------------------
# Fonctions Edge : `verify_jwt` doit être posé ICI et pas en flag de ligne de
# commande. Chaque fonction s'authentifie elle-même (`assertAuthorised` /
# `assertRole` : x-cron-secret, sinon JWT + rôle). Les jobs pg_cron appellent
# avec le seul header `x-cron-secret` : si la passerelle exigeait un JWT, le
# minuit prendrait 401 et ne tournerait plus. Un `functions deploy` sans ces
# entrées remettrait la vérification à `true` (défaut CLI) et casserait les crons.
#
# Relevé de l'état réel du projet le 2026-09-12 : tout est à false, sauf
# `bruler-texte-test` (appelée depuis l'admin avec un JWT).
# ---------------------------------------------------------------------------

[functions.ameliorer-review]
verify_jwt = false

[functions.assignation]
verify_jwt = false

# Test à blanc d'une assignation (admin) : même contrôle interne que
# `assignation` (assertAuthorised), jamais d'écriture — voir docs/assignation-a-blanc.md.
[functions.assignation-a-blanc]
verify_jwt = false

[functions.assignation-contenu]
verify_jwt = false

