project_id = "sophia-creative-studio"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Auth réelle = assertAuthorised (PostgREST + rôles). Le verify JWT du
# gateway casse les sessions ES256 (UNAUTHORIZED_ASYMMETRIC_JWT).
[functions.upscale-media]
verify_jwt = false

[functions.strip-c2pa]
verify_jwt = false

[functions.renettoyer-contenu]
verify_jwt = false
